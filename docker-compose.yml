services:
  dev:
    container_name: template-rust-web-app-dev
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - ".:/template-rust-web-app"
      - "./.aws:/root/.aws"
      - "./zshrc:/root/.zshrc"
      - template-rust-web-app-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HISTFILE=/cache/.bash_history
    entrypoint: top -b
    logging:
      driver: none

volumes:
  template-rust-web-app-cache:
